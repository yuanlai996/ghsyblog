<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · GHSY 手记</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('ghsy-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<main class="main" id="main">
  <div class="container container--narrow" style="padding-top:110px;text-align:center">
    <p style="font-family:var(--font-serif);font-size:clamp(4rem,14vw,7rem);line-height:1;
              margin:0;color:var(--accent);font-weight:600">404</p>
    <h1 style="font-family:var(--font-serif);font-size:1.7rem;margin:18px 0 10px">这页好像不存在</h1>
    <p style="color:var(--text-soft);max-width:420px;margin:0 auto 30px">
      链接可能过期了，或者地址打错了一个字母。不妨从首页重新找找。
    </p>
    <div class="hero__actions" style="justify-content:center">
      <a class="btn btn--primary" href="/">回到首页</a>
      <a class="btn btn--ghost" href="/index.html#posts">看看全部文章</a>
    </div>
  </div>
</main>
</body>
</html>
